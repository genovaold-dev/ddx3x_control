name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="github-actions"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "=== CODE SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -e

          echo -n "$APPSTORE_PRIVATE_KEY_BASE64" \
            | base64 --decode \
            -o "$RUNNER_TEMP/AuthKey.p8"

          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Prepare Flutter iOS build
        run: flutter build ios --release --no-codesign

      - name: Configure Runner automatic distribution signing
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          config_id = "97C147071CF9000F007C117D /* Release */ = {"

          start = text.find(config_id)
          if start == -1:
              raise SystemExit("Runner Release configuration not found")

          settings_marker = "\n\t\t\tbuildSettings = {\n"
          settings_start = text.find(settings_marker, start)

          if settings_start == -1:
              raise SystemExit("Runner Release buildSettings not found")

          settings_end = text.find("\n\t\t\t};", settings_start)

          if settings_end == -1:
              raise SystemExit("Runner Release buildSettings end not found")

          block = text[settings_start:settings_end]

          lines = block.splitlines(True)

          filtered = []
          for line in lines:
              if "CODE_SIGN_STYLE =" in line:
                  continue
              if "CODE_SIGN_IDENTITY =" in line:
                  continue
              if "PROVISIONING_PROFILE_SPECIFIER =" in line:
                  continue
              if "DEVELOPMENT_TEAM =" in line:
                  continue
              filtered.append(line)

          signing = (
              "\t\t\t\tCODE_SIGN_STYLE = Automatic;\n"
              "\t\t\t\tDEVELOPMENT_TEAM = 5DW4D2TY84;\n"
          )

          new_block = "".join(filtered) + signing

          text = (
              text[:settings_start]
              + new_block
              + text[settings_end:]
          )

          path.write_text(text)

          print("Runner Release automatic signing configured.")
          PY

      - name: Archive iOS app
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -e

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            archive

      - name: Export IPA
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -e

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-control-ipa
          path: ${{ runner.temp }}/export/*.ipa
