name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="github-actions"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "=== CODE SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "=== PROVISIONING PROFILE ==="
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PP_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Prepare Flutter iOS build
        run: flutter build ios --release --no-codesign

      - name: Configure Runner Release signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          config_id = "97C147071CF9000F007C117D /* Release */ = {"

          start = text.find(config_id)
          if start == -1:
              raise SystemExit("Runner Release configuration not found")

          settings_marker = "\n\t\t\tbuildSettings = {\n"
          settings_start = text.find(settings_marker, start)

          if settings_start == -1:
              raise SystemExit("Runner Release buildSettings not found")

          signing = (
              '\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
              '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution: Associazione DDX3X ODV (5DW4D2TY84)";\n'
              '\t\t\t\tDEVELOPMENT_TEAM = 5DW4D2TY84;\n'
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = DDX3X_AppStore_Profile;\n'
          )

          insert_at = settings_start + len(settings_marker)

          text = text[:insert_at] + signing + text[insert_at:]

          path.write_text(text)

          print("Runner Release signing configured successfully.")
          PY

      - name: Verify Runner Release signing
        run: |
          echo "=== RUNNER RELEASE SIGNING ==="

          python3 <<'PY'
          from pathlib import Path

          text = Path("ios/Runner.xcodeproj/project.pbxproj").read_text()

          config_id = "97C147071CF9000F007C117D /* Release */ = {"
          start = text.find(config_id)

          if start == -1:
              raise SystemExit("Runner Release configuration not found")

          end = text.find("\n\t\t};", start)

          if end == -1:
              raise SystemExit("Runner Release configuration end not found")

          block = text[start:end]

          required = [
              "CODE_SIGN_STYLE = Manual;",
              'CODE_SIGN_IDENTITY = "Apple Distribution: Associazione DDX3X ODV (5DW4D2TY84)";',
              "DEVELOPMENT_TEAM = 5DW4D2TY84;",
              "PROVISIONING_PROFILE_SPECIFIER = DDX3X_AppStore_Profile;",
          ]

          for item in required:
              if item not in block:
                  raise SystemExit(f"Missing Runner signing setting: {item}")

          print("Runner Release signing settings are present.")
          PY

      - name: Archive iOS app
        run: |
          set -e

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            archive

      - name: Export IPA
        run: |
          set -e

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-control-ipa
          path: ${{ runner.temp }}/export/*.ipa
