name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Decode signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          printf '%s' "$IOS_CERTIFICATE_BASE64" \
            | sed '/BEGIN CERTIFICATE/ d; /END CERTIFICATE/ d' \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$RUNNER_TEMP/ddx3x_distribution.p12"

          test -s "$RUNNER_TEMP/ddx3x_distribution.p12"

      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$RUNNER_TEMP/ddx3x.mobileprovision"

          test -s "$RUNNER_TEMP/ddx3x.mobileprovision"

      - name: Install signing certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ddx3x-signing.keychain-db"

          security create-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security import \
            "$RUNNER_TEMP/ddx3x_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          security cms \
            -D \
            -i "$RUNNER_TEMP/ddx3x.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print UUID" \
            "$RUNNER_TEMP/profile.plist"
          )

          NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print Name" \
            "$RUNNER_TEMP/profile.plist"
          )

          TEAM=$(
            /usr/libexec/PlistBuddy \
            -c "Print TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"
          )

          echo "Profile: $NAME"
          echo "UUID: $UUID"
          echo "Team: $TEAM"

          cp \
            "$RUNNER_TEMP/ddx3x.mobileprovision" \
            "$PROFILE_DIR/$UUID.mobileprovision"

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>5DW4D2TY84</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.example.ddx3xControl</key>
                  <string>DDX3X_AppStore_Profile</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-control-ipa
          path: build/ios/ipa/*.ipa
