name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="github-actions"

          echo -n "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            -o "$CERTIFICATE_PATH"

          echo -n "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            -o "$PROFILE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_APP_ID=$PROFILE_APP_ID" >> "$GITHUB_ENV"

          echo "=== PROVISIONING PROFILE ==="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Application ID: $PROFILE_APP_ID"

          echo "=== CODE SIGNING IDENTITIES ==="
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      - name: Install App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -e

          echo -n "$APPSTORE_PRIVATE_KEY_BASE64" \
            | base64 --decode \
            -o "$RUNNER_TEMP/AuthKey.p8"

          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Prepare Flutter iOS build
        run: flutter build ios --release --no-codesign

      - name: Configure Runner manual App Store signing
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          profile_uuid = os.environ["PROFILE_UUID"]

          config_id = "97C147071CF9000F007C117D /* Release */ = {"

          start = text.find(config_id)

          if start == -1:
              raise SystemExit("Runner Release configuration not found")

          settings_marker = "\n\t\t\tbuildSettings = {\n"

          settings_start = text.find(
              settings_marker,
              start
          )

          if settings_start == -1:
              raise SystemExit(
                  "Runner Release buildSettings not found"
              )

          settings_end = text.find(
              "\n\t\t\t};",
              settings_start
          )

          if settings_end == -1:
              raise SystemExit(
                  "Runner Release buildSettings end not found"
              )

          block = text[
              settings_start:settings_end
          ]

          lines = block.splitlines(True)

          filtered = []

          for line in lines:
              if "CODE_SIGN_STYLE =" in line:
                  continue

              if "CODE_SIGN_IDENTITY =" in line:
                  continue

              if "PROVISIONING_PROFILE_SPECIFIER =" in line:
                  continue

              if "DEVELOPMENT_TEAM =" in line:
                  continue

              filtered.append(line)

          signing = (
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution: Associazione DDX3X ODV (5DW4D2TY84)";\n'
              "\t\t\t\tDEVELOPMENT_TEAM = 5DW4D2TY84;\n"
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_uuid}";\n'
          )

          new_block = "".join(filtered) + signing

          text = (
              text[:settings_start]
              + new_block
              + text[settings_end:]
          )

          path.write_text(text)

          print("=== RUNNER SIGNING ===")
          print("CODE_SIGN_STYLE = Manual")
          print("DEVELOPMENT_TEAM = 5DW4D2TY84")
          print(
              f"PROVISIONING_PROFILE_SPECIFIER = {profile_uuid}"
          )
          PY

      - name: Archive iOS app
        run: |
          set -e

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
             archive

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>5DW4D2TY84</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.example.ddx3xControl</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          set -e

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-control-ipa
          path: ${{ runner.temp }}/export/*.ipa
