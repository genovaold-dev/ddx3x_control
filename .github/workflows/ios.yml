name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="github-actions"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "=== CODE SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "=== PROVISIONING PROFILE ==="
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PP_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Prepare Flutter iOS build
        run: flutter build ios --release --no-codesign

      - name: Archive iOS app
        run: |
          set -e

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=5DW4D2TY84 \
            CODE_SIGN_IDENTITY="Apple Distribution: Associazione DDX3X ODV (5DW4D2TY84)" \
            PROVISIONING_PROFILE_SPECIFIER="DDX3X_AppStore_Profile" \
            archive

      - name: Export IPA
        run: |
          set -e

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-control-ipa
          path: ${{ runner.temp }}/export/*.ipa
