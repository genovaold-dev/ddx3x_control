name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Decode signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ]; then
            echo "ERRORE: IOS_CERTIFICATE_BASE64 è vuoto."
            exit 1
          fi

          printf '%s' "$IOS_CERTIFICATE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$RUNNER_TEMP/ddx3x_distribution.p12"

          echo "Certificato .p12 decodificato correttamente."

      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "ERRORE: IOS_PROVISIONING_PROFILE_BASE64 è vuoto."
            exit 1
          fi

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$RUNNER_TEMP/ddx3x.mobileprovision"

          echo "Provisioning profile decodificato correttamente."

      - name: Install signing certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ddx3x-signing.keychain-db"

          security create-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security import \
            "$RUNNER_TEMP/ddx3x_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN_PATH"

          echo "Certificato installato nel keychain."

      - name: Install provisioning profile
        run: |
          PROFILE_PATH="$RUNNER_TEMP/ddx3x.mobileprovision"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print UUID" \
            "$RUNNER_TEMP/profile.plist"
          )

          NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print Name" \
            "$RUNNER_TEMP/profile.plist"
          )

          TEAM=$(
            /usr/libexec/PlistBuddy \
            -c "Print TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"
          )

          APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"
          )

          echo "Provisioning Profile:"
          echo "Name: $NAME"
          echo "UUID: $UUID"
          echo "Team: $TEAM"
          echo "Application Identifier: $APP_ID"

          cp \
            "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Prepare Flutter iOS project
        run: |
          flutter build ios --release --no-codesign

      - name: Disable Pods signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          pods_path = Path("ios/Pods/Pods.xcodeproj/project.pbxproj")

          if not pods_path.exists():
              print("ERRORE: Pods.xcodeproj non trovato.")
              raise SystemExit(1)

          pods_text = pods_path.read_text()

          pods_text = re.sub(
              r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=.*?;\s*$',
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "";',
              pods_text,
              flags=re.M
          )

          pods_text = re.sub(
              r'^\s*CODE_SIGNING_ALLOWED\s*=.*?;\s*$',
              '\t\t\t\tCODE_SIGNING_ALLOWED = NO;',
              pods_text,
              flags=re.M
          )

          pods_text = re.sub(
              r'^\s*CODE_SIGNING_REQUIRED\s*=.*?;\s*$',
              '\t\t\t\tCODE_SIGNING_REQUIRED = NO;',
              pods_text,
              flags=re.M
          )

          pods_path.write_text(pods_text)

          print("Pods configurati senza firma.")

      - name: Verify signing configuration
        run: |
          echo "===== RUNNER SIGNING ====="

          grep -n \
            -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj \
            || true

          echo ""
          echo "===== PODS SIGNING ====="

          grep -n \
            -E "CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Pods/Pods.xcodeproj/project.pbxproj \
            || true

      - name: Build signed iOS archive
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            archive

      - name: Create signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>5DW4D2TY84</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.example.ddx3xControl</key>
                  <string>DDX3X_AppStore_Profile</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          cp \
            "$RUNNER_TEMP/export/"*.ipa \
            ddx3x_control.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-control-ipa
          path: ddx3x_control.ipa
    
