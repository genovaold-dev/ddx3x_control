name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Decode signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" \
            | sed '/-----BEGIN /d; /-----END /d' \
            | tr -d '\r\n ' \
            | base64 --decode > "$RUNNER_TEMP/ddx3x_distribution.p12"

          test -s "$RUNNER_TEMP/ddx3x_distribution.p12"

      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_BASE64" \
            | sed '/-----BEGIN /d; /-----END /d' \
            | tr -d '\r\n ' \
            | base64 --decode > "$RUNNER_TEMP/ddx3x.mobileprovision"

          test -s "$RUNNER_TEMP/ddx3x.mobileprovision"

      - name: Install signing certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ddx3x-signing.keychain-db"

          security create-keychain -p "github-actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "github-actions" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/ddx3x_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          PROFILE_PATH="$RUNNER_TEMP/ddx3x.mobileprovision"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")

          echo "Provisioning Profile:"
          echo "Name: $NAME"
          echo "UUID: $UUID"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Prepare Flutter iOS project
        run: |
          flutter build ios --release --no-codesign

      - name: Configure Runner signing and Pods signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # RUNNER:
          # Impostiamo la firma manuale direttamente nel progetto
          # Runner, così non dobbiamo passare il provisioning profile
          # globalmente a xcodebuild.
          # ---------------------------------------------------------

          runner = Path("ios/Runner.xcodeproj/project.pbxproj")

          if not runner.exists():
              print("ERRORE: Runner.xcodeproj non trovato.")
              raise SystemExit(1)

          text = runner.read_text()

          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;"
          )

          text = text.replace(
              "DEVELOPMENT_TEAM = \"\";",
              "DEVELOPMENT_TEAM = 5DW4D2TY84;"
          )

          text = text.replace(
              "DEVELOPMENT_TEAM = ;",
              "DEVELOPMENT_TEAM = 5DW4D2TY84;"
          )

          text = text.replace(
              "CODE_SIGN_IDENTITY = \"Apple Development\";",
              "CODE_SIGN_IDENTITY = \"Apple Distribution: Associazione DDX3X ODV (5DW4D2TY84)\";"
          )

          text = text.replace(
              "CODE_SIGN_IDENTITY = \"iPhone Developer\";",
              "CODE_SIGN_IDENTITY = \"Apple Distribution: Associazione DDX3X ODV (5DW4D2TY84)\";"
          )

          # Inserisce il provisioning profile nel progetto Runner.
          if "PROVISIONING_PROFILE_SPECIFIER = DDX3X_AppStore_Profile;" not in text:
              text = text.replace(
                  "PRODUCT_BUNDLE_IDENTIFIER = com.example.ddx3xControl;",
                  "PRODUCT_BUNDLE_IDENTIFIER = com.example.ddx3xControl;\n"
                  "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = DDX3X_AppStore_Profile;"
              )

          runner.write_text(text)

          # ---------------------------------------------------------
          # PODS:
          # Nessun provisioning profile deve essere assegnato ai Pods.
          # In particolare GoogleDataTransport non lo supporta.
          # ---------------------------------------------------------

          pods = Path("ios/Pods/Pods.xcodeproj/project.pbxproj")

          if not pods.exists():
              print("ERRORE: Pods.xcodeproj non trovato.")
              raise SystemExit(1)

          pods_text = pods.read_text()

          pods_text = pods_text.replace(
              "PROVISIONING_PROFILE_SPECIFIER = DDX3X_AppStore_Profile;",
              "PROVISIONING_PROFILE_SPECIFIER = \"\";"
          )

          pods_text = pods_text.replace(
              "PROVISIONING_PROFILE_SPECIFIER = \"DDX3X_AppStore_Profile\";",
              "PROVISIONING_PROFILE_SPECIFIER = \"\";"
          )

          pods.write_text(pods_text)

          print("Runner configurato per firma manuale.")
          print("Pods configurati senza provisioning profile.")
          PY

      - name: Build signed iOS archive
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            archive

      - name: Create signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>5DW4D2TY84</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.example.ddx3xControl</key>
                  <string>DDX3X_AppStore_Profile</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DDX3X.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          cp "$RUNNER_TEMP/export/"*.ipa ddx3x_control.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-control-ipa
          path: ddx3x_control.ipa

