name: Build Signed iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # -------------------------------
      # IMPORTA CERTIFICATO + KEYCHAIN
      # -------------------------------
      - name: Decode certificate
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > ios_cert.p12

      - name: Create keychain
        run: |
          # CREA LA KEYCHAIN
          security create-keychain -p "github" build.keychain

          # IMPOSTA COME DEFAULT
          security default-keychain -s build.keychain

          # SBLOCCA LA KEYCHAIN
          security unlock-keychain -p "github" build.keychain

          # IMPOSTA PERMESSI CORRETTI
          security set-keychain-settings -t 3600 -u build.keychain

          # IMPORTA IL CERTIFICATO SOLO ORA
          security import ios_cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          # RENDE LA KEYCHAIN “TRUSTED”
          security list-keychains -s build.keychain

      # -------------------------------
      # IMPORTA PROVISIONING PROFILE
      # -------------------------------
      - name: Decode provisioning profile
        run: |
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # -------------------------------
      # COSTRUISCI ARCHIVIO iOS
      # -------------------------------
      - name: Build iOS archive
        run: |
          flutter build ios --release --no-codesign

      # -------------------------------
      # ESPORTA IPA FIRMATA
      # -------------------------------
      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-signed-ipa
          path: build/ios/ipa/*.ipa
