name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install Codemagic CLI tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install codemagic-cli-tools

      - name: Decode signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          printf '%s' "$IOS_CERTIFICATE_BASE64" \
            | sed '/BEGIN CERTIFICATE/ d; /END CERTIFICATE/ d' \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$RUNNER_TEMP/ddx3x_distribution.p12"

          test -s "$RUNNER_TEMP/ddx3x_distribution.p12"

      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$RUNNER_TEMP/ddx3x.mobileprovision"

          test -s "$RUNNER_TEMP/ddx3x.mobileprovision"

      - name: Install Apple certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ddx3x-signing.keychain-db"

          security create-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security import \
            "$RUNNER_TEMP/ddx3x_distribution.p12" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          security cms \
            -D \
            -i "$RUNNER_TEMP/ddx3x.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print UUID" \
            "$RUNNER_TEMP/profile.plist"
          )

          NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print Name" \
            "$RUNNER_TEMP/profile.plist"
          )

          TEAM=$(
            /usr/libexec/PlistBuddy \
            -c "Print TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"
          )

          APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"
          )

          echo "Provisioning Profile:"
          echo "Name: $NAME"
          echo "UUID: $UUID"
          echo "Team: $TEAM"
          echo "Application Identifier: $APP_ID"

          cp \
            "$RUNNER_TEMP/ddx3x.mobileprovision" \
            "$PROFILE_DIR/$UUID.mobileprovision"

      - name: Configure Xcode signing profiles
        run: |
          xcode-project use-profiles

      - name: Build signed IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-control-ipa
          path: build/ios/ipa/*.ipa
