name: Build Signed iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # ---------------------------------------------------
      # DECODE P12 + DEBUG
      # ---------------------------------------------------
      - name: Decode certificate
        run: |
          printf "%s" "$IOS_CERTIFICATE_BASE64" | base64 -d > ios_cert.p12

          echo "DIMENSIONE P12:"
          ls -l ios_cert.p12

          echo "TIPO FILE:"
          file ios_cert.p12

          echo "HEX (prime 64 bytes):"
          xxd -l 64 ios_cert.p12 || echo "xxd non disponibile"

      # ---------------------------------------------------
      # CREA E CONFIGURA LA KEYCHAIN
      # ---------------------------------------------------
      - name: Create keychain
        run: |
          security create-keychain -p "github" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "github" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "IMPORTING P12..."
          security import ios_cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          echo "KEYCHAINS:"
          security list-keychains

      # ---------------------------------------------------
      # IMPORTA PROVISIONING PROFILE
      # ---------------------------------------------------
      - name: Decode provisioning profile
        run: |
          printf "%s" "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode --ignore-garbage > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # ---------------------------------------------------
      # COSTRUISCI ARCHIVIO iOS
      # ---------------------------------------------------
      - name: Build iOS archive
        run: |
          flutter build ios --release --no-codesign

      # ---------------------------------------------------
      # ESPORTA IPA FIRMATA
      # ---------------------------------------------------
      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ddx3x-signed-ipa
          path: build/ios/ipa/*.ipa

