name: Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Decode API key
        run: |
          echo "${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}" | base64 --decode > AuthKey.p8

      - name: Create API key JSON
        run: |
          echo "{
            \"key_id\": \"${{ secrets.APPSTORE_KEY_ID }}\",
            \"issuer_id\": \"${{ secrets.APPSTORE_ISSUER_ID }}\",
            \"key\": \"$(sed ':a;N;$!ba;s/\n/\\n/g' AuthKey.p8)\"
          }" > api_key.json

      - name: Upload IPA to TestFlight
        run: |
          fastlane pilot upload \
            --ipa artifacts/ddx3x_control.ipa \
            --api_key_path api_key.json
