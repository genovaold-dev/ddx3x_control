name: Upload to TestFlight

on:
  workflow_dispatch:   # PARTE SOLO QUANDO LO LANCIA BRUNO

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Create API key file
        run: |
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > AuthKey.p8

      - name: Upload IPA to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          fastlane pilot upload \
            --ipa artifacts/ddx3x_control.ipa \
            --api-key-file AuthKey.p8 \
            --api-key "$APPSTORE_KEY_ID" \
            --api-issuer-id "$APPSTORE_ISSUER_ID"
